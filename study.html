<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar · Study</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/svg+xml" sizes="any" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<main id="page">
  <div class="loading-page"><div class="brand-mark" data-mark></div>Reading the study record…</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="assets/app.js?v=study-load-1"></script>
<script>
(() => {

  const id = (new URLSearchParams(location.search).get('id') ?? '').toUpperCase().trim();
  const ME_KEY = 'northstar:me';
  let me, profile, checklist, answers;

  /* ---------- Plain-language study design ---------- */
  function designLines(p) {
    const d = p.designModule ?? {}, info = d.designInfo ?? {};
    const arms = p.armsInterventionsModule?.armGroups ?? [];
    const out = [];
    if (d.studyType === 'OBSERVATIONAL') {
      out.push([I.eye, 'You won’t be given a new treatment. Researchers observe and record what happens during your usual care.']);
    } else if (d.studyType === 'EXPANDED_ACCESS') {
      out.push([I.pill, 'This is expanded access: a way to get an investigational treatment outside a regular trial, usually when other options have run out.']);
    }
    if (info.allocation === 'RANDOMIZED') out.push([I.shuffle, 'You’ll be placed in a group by chance, like a coin flip. You won’t get to choose. This is called being randomized.']);
    if (info.allocation === 'NON_RANDOMIZED') out.push([I.split, 'Groups are assigned on purpose, not by chance, often based on things like your health history.']);
    const model = {
      SINGLE_GROUP: 'Everyone in the study gets the same treatment.',
      PARALLEL: `Each group gets something different at the same time${arms.length ? `. There are ${arms.length} groups` : ''}.`,
      CROSSOVER: 'You’ll try each treatment one after another, with a break in between.',
      SEQUENTIAL: 'Groups join one after another, often at increasing doses, once the earlier group looks safe.',
      FACTORIAL: 'Several treatments are tested in different combinations at once.',
    }[info.interventionModel];
    if (model) out.push([I.people, model]);
    const mask = info.maskingInfo?.masking;
    if (mask === 'NONE') out.push([I.eye, 'Nothing is hidden. You and your doctors will know which treatment you get. This is called open-label.']);
    if (mask === 'SINGLE') out.push([I.eye, 'You won’t know which treatment you’re getting, but your doctors will.']);
    if (['DOUBLE', 'TRIPLE', 'QUADRUPLE'].includes(mask)) out.push([I.eye, 'Neither you nor your doctors will know which treatment you get until the study ends. This is called double-blind, and it keeps the results fair.']);
    if (arms.some(a => a.type === 'PLACEBO_COMPARATOR')) out.push([I.pill, 'Some people will get a placebo, which looks like the treatment but has no active drug.']);
    if (arms.some(a => a.type === 'SHAM_COMPARATOR')) out.push([I.pill, 'Some people will get a sham procedure, which looks like the real one but doesn’t do anything.']);
    return out;
  }

  const ARM = {
    EXPERIMENTAL: 'Gets the treatment being tested',
    ACTIVE_COMPARATOR: 'Gets an existing treatment, for comparison',
    PLACEBO_COMPARATOR: 'Gets a placebo',
    SHAM_COMPARATOR: 'Gets a sham procedure',
    NO_INTERVENTION: 'No treatment, just check-ins',
    OTHER: 'Other',
  };

  function durationPhrase(a, b) {
    const da = parseDate(a), db = parseDate(b);
    if (!da || !db || db <= da) return null;
    const months = Math.round((db - da) / (30.44 * 864e5));
    if (months < 1) return 'Under a month';
    if (months < 18) return `About ${months} month${months === 1 ? '' : 's'}`;
    const yrs = Math.round(months / 6) / 2;
    return `About ${yrs % 1 ? yrs : yrs.toFixed(0)} years`;
  }

  /* ---------- Render ---------- */
  async function load() {
    if (!/^NCT\d{8}$/.test(id)) return fail('That doesn’t look like a study ID', 'Study IDs look like NCT01234567.');
    const request = new AbortController();
    const timer = setTimeout(() => request.abort(), 12000);
    let d;
    try { d = await api(`/studies/${id}`, {}, { signal: request.signal }); }
    catch (err) {
      return fail('We couldn’t load this study', request.signal.aborted
        ? 'ClinicalTrials.gov took too long to respond. Try refreshing this page.'
        : `${err.message}. It may have been removed, or ClinicalTrials.gov may be busy.`);
    } finally { clearTimeout(timer); }
    render(d);
  }

  function fail(title, body) {
    $('#page').innerHTML = `<div class="wrap" style="padding:80px 0"><div class="state"><h2>${esc(title)}</h2><p>${esc(body)}</p><a class="btn" href="${esc(searchToUrl(loadSearch()))}">Back to Studies</a></div></div>`;
  }

  const SPONSOR_CLASS = {
    INDUSTRY: 'A company that develops treatments.',
    NIH: 'The U.S. National Institutes of Health.',
    FED: 'A U.S. federal agency.',
    OTHER_GOV: 'A government agency or public institution.',
    NETWORK: 'A research network.',
    INDIV: 'An individual researcher.',
    OTHER: 'Often a university, hospital or nonprofit.',
  };
  const OFFICIAL_ROLE = {
    PRINCIPAL_INVESTIGATOR: ['Principal Investigator', 'The doctor or scientist who leads the study.'],
    STUDY_DIRECTOR: ['Study Director', 'Oversees how the study is run.'],
    STUDY_CHAIR: ['Study Chair', 'Heads the study, often across several sites.'],
  };
  const webSearch = q => `https://www.google.com/search?q=${encodeURIComponent(q)}`;
  const pubmed = q => `https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(q)}`;
  const plainName = n => (n ?? '').split(',')[0].replace(/\b(dr|prof)\.?\s/i, '').trim();
  const listNames = a => a.length > 2 ? `${a.slice(0, 2).join(', ')} and ${a.length - 2} more` : a.join(' and ');
  const nameKey = n => (n ?? '').split(',')[0].toLowerCase().replace(/\b(dr|md|phd|m\.d|ph\.d)\b\.?/g, '').replace(/[^a-z]/g, '');
  // Everyone the record names as leading the study, with the sponsor's responsible investigator merged in.
  function whoPeople(officials = [], rp) {
    const out = officials.filter(o => o.name).map(o => {
      const [label, gloss] = OFFICIAL_ROLE[o.role] ?? [title(o.role) || 'Study Official', ''];
      return { name: o.name, label, gloss, affiliation: o.affiliation, title: '' };
    });
    if (rp?.investigatorFullName) {
      const hit = out.find(x => nameKey(x.name) === nameKey(rp.investigatorFullName));
      const t = rp.investigatorTitle && !/^principal investigator$/i.test(rp.investigatorTitle) ? rp.investigatorTitle : '';
      if (hit) hit.title = t;
      else out.unshift({ name: rp.investigatorFullName, label: 'Investigator', gloss: 'Responsible for the study on behalf of the sponsor.', affiliation: rp.investigatorAffiliation, title: t });
    }
    return out;
  }

  let studyData = null;
  function render(d) {
    studyData = d;
    const p = d.protocolSection;
    const idm = p.identificationModule, st = p.statusModule ?? {}, des = p.designModule ?? {};
    const elig = p.eligibilityModule ?? {}, cl = p.contactsLocationsModule ?? {};
    const spons = p.sponsorCollaboratorsModule ?? {};
    const interventions = p.armsInterventionsModule?.interventions ?? [];
    const arms = p.armsInterventionsModule?.armGroups ?? [];
    document.title = `Northstar · ${idm.briefTitle}`;

    // Locations with distance
    const sites = (cl.locations ?? []).map((l, i) => ({
      ...l, i,
      mi: me && l.geoPoint ? milesBetween(me, l.geoPoint) : null,
    })).sort((a, b) => {
      // Enrolling sites first, then by distance.
      const open = (a.status === 'RECRUITING' ? 0 : 1) - (b.status === 'RECRUITING' ? 0 : 1);
      if (open) return open;
      if (a.mi != null && b.mi != null) return a.mi - b.mi;
      if (a.mi != null) return -1;
      if (b.mi != null) return 1;
      return (a.status === 'RECRUITING' ? 0 : 1) - (b.status === 'RECRUITING' ? 0 : 1);
    });
    const nearest = sites.find(s => s.mi != null && s.status === 'RECRUITING') ?? sites.find(s => s.mi != null);
    const openSites = sites.filter(s => s.status === 'RECRUITING').length;

    const tested = interventions.filter(i => !/placebo/i.test(i.name)).map(i => i.name);
    const phase = phaseLabel(des.phases, des.studyType);
    const summaryParas = unescapeMd(p.descriptionModule?.briefSummary ?? '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    const detailParas = unescapeMd(p.descriptionModule?.detailedDescription ?? '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    const seen = new Set();
    const para = t => `<p>${glossify(esc(t), seen)}</p>`;

    const crit = parseCriteria(elig.eligibilityCriteria);
    checklist = checklistAnswersFor(id, crit, st.lastUpdatePostDateStruct?.date);
    answers = checklist.answers;
    const critSeen = new Set();
    const critList = (items, side) => items.map((c, n) => {
      const key = `${side}${n}`, a = c.head ? '' : answers[key] ?? '';
      const cls = [c.sub && 'sub', c.head && 'head', a && `is-${rowState(key, a)}`].filter(Boolean).join(' ');
      return `<li class="${cls}" data-key="${key}">
        <span class="dot" aria-hidden="true"></span>
        <span class="txt">${glossify(esc(c.text), critSeen)}</span>
        ${c.head ? '' : `<div class="ans" role="group" aria-label="${side === 'i' ? 'Is this true for you?' : 'Does this apply to you?'}">${ANS.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${a === v}">${l}</button>`).join('')}</div>`}
      </li>`;
    }).join('');
    const critGroup = (side, title, hint, items) => `<section class="crit-group" data-side="${side}">
        <header><div><h3>${title}</h3><p>${hint}</p></div><span class="crit-count" data-total="${items.filter(c => !c.head).length}"></span></header>
        ${items.length ? `<ul class="crit">${critList(items, side)}</ul>` : '<p class="muted crit-none">None listed</p>'}
      </section>`;

    const contacts = (cl.centralContacts ?? []).slice(0, 2);
    // People you could write to: the study-wide contact first, then the closest open sites that list someone.
    const recips = [
      ...contacts.filter(c => c.email || c.phone).map(c => ({ name: c.name || 'Study team', where: 'Main contact for the whole study', email: c.email, phone: c.phone, ext: c.phoneExt })),
      ...sites.filter(s => s.status === 'RECRUITING').flatMap(s => {
        const c = (s.contacts ?? []).find(c => c.email || c.phone);
        return c ? [{ name: c.name || 'Study team', where: [s.facility, s.city].filter(Boolean).join(', '), mi: s.mi, facility: s.facility, email: c.email, phone: c.phone, ext: c.phoneExt, site: true }] : [];
      }).slice(0, 3),
    ];
    const hasPlacebo = arms.some(a => a.type === 'PLACEBO_COMPARATOR');
    const officials = (cl.overallOfficials ?? []).slice(0, 2);
    const people = whoPeople(cl.overallOfficials, spons.responsibleParty);
    const design = designLines(p);
    const outcomes = p.outcomesModule?.primaryOutcomes ?? [];
    const conds = p.conditionsModule?.conditions ?? [];
    // Some names carry their own comma ("Ovarian Cancer, Epithelial"), so those lists use semicolons.
    const condSep = conds.some(c => c.includes(',')) ? '; ' : ', ';
    const focus = studyFocus(loadSearch().cond, idm.briefTitle, conds);

    const back = searchToUrl(loadSearch());

    $('#page').innerHTML = `
      <div class="wrap crumbs"><a href="${esc(back)}">${I.back}Back to Studies</a></div>

      <section class="study-hero">
        <div class="wrap study-hero-grid">
          <div>
            <div class="card-top" style="gap:6px">
              ${statusTag(st.overallStatus)}
              ${phase ? `<span class="tag">${esc(phase)}</span>` : ''}
              ${focus.label ? `<span class="tag">${esc(focus.label)}</span>` : ''}
              ${[...new Set(interventions.map(i => i.type))].filter(t => t !== 'OTHER').slice(0, 2).map(t => `<span class="tag">${esc(INTERVENTION[t] ?? t)}</span>`).join('')}
            </div>
            <h1 class="display${idm.briefTitle.length > 90 ? ' t-long' : idm.briefTitle.length > 50 ? ' t-mid' : ''}">${esc(idm.briefTitle)}</h1>
            ${idm.officialTitle && idm.officialTitle !== idm.briefTitle ? `<details class="official"><summary>Show Official Title ${I.chev}</summary><p>${esc(idm.officialTitle)}</p></details>` : ''}
            <div class="hero-meta">
              ${spons.leadSponsor?.name ? `<span>Run by <b>${esc(spons.leadSponsor.name)}</b></span>` : ''}
              ${conds.length ? `<span>For <b>${esc(conds.slice(0, 3).join(condSep))}</b>${conds.length > 3 ? ` <button type="button" class="btn-link" id="moreConds" aria-expanded="false" aria-controls="condList">and ${fmtNum(conds.length - 3)} more</button>` : ''}</span>` : ''}
              <span class="mono">${esc(idm.nctId)}</span>
            </div>
            ${conds.length > 3 ? `<p class="cond-list" id="condList" hidden><b>All ${fmtNum(conds.length)} conditions:</b> ${esc(conds.join(condSep))}.${focus.broad ? ' Who can join, including age and sex, is set for the whole study, so check that your condition is one of the groups.' : ''}</p>` : ''}
          </div>

          <aside class="contact-card">
            <h2>Interested?</h2>
            <p>${st.overallStatus === 'RECRUITING' ? 'Reach out to the study team. Asking questions doesn’t commit you to anything.' : 'This study isn’t enrolling right now, but the team can tell you what’s next.'}</p>
            ${contacts.length ? contacts.map(c => `
              <div class="contact-person">
                <strong>${esc(c.name ?? 'Study contact')}</strong>
                ${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${I.phone}${esc(c.phone)}${c.phoneExt ? ` ext. ${esc(c.phoneExt)}` : ''}</a>` : ''}
                ${c.email ? `<a href="mailto:${esc(c.email)}?subject=${encodeURIComponent(`Question about ${idm.nctId}`)}">${I.mail}${esc(c.email)}</a>` : ''}
              </div>`).join('') : officials.length ? officials.map(o => `
              <div class="contact-person"><strong>${esc(o.name)}</strong><span style="color:rgba(255,255,255,.7)">${esc(o.affiliation ?? '')}</span></div>`).join('') + `<div class="contact-person" style="color:rgba(255,255,255,.7)">No central contact is listed. Try the nearest site below, or ask your doctor.</div>`
              : `<div class="contact-person" style="color:rgba(255,255,255,.7)">No contact is listed. Try the nearest site below, or ask your doctor.</div>`}
            <a class="btn btn-mint" href="#eligibility" data-open-check="all">See If I Can Join ${I.arrow}</a>
            <a class="official-link" href="#reach">${I.mail}Get Help Writing to Them</a>
            <a class="official-link" href="doctor.html?id=${esc(idm.nctId)}" data-open-brief>${I.print}For My Doctor</a>
          </aside>
        </div>
      </section>

      <div class="wrap study-body">
        <nav class="toc" aria-label="On this page">
          <ol>
            <li><a href="#overview">Overview</a></li>
            <li><a href="#eligibility">Can I Join?</a></li>
            <li><a href="#reach">Reach Out</a></li>
            <li><a href="#happens">What Happens</a></li>
            <li><a href="#who">Who’s Running It</a></li>
            <li><a href="#where">Where</a></li>
            <li><a href="#timeline">Timeline</a></li>
            <li><a href="#details">Details</a></li>
          </ol>
        </nav>

        <div>
          <!-- Overview -->
          <section class="sec" id="overview">
            <h2>What this study is about</h2>
            <div class="prose">${summaryParas.map(para).join('') || '<p>No summary was provided.</p>'}</div>
            ${detailParas.length ? `
              <details class="prose read-more"><summary class="btn-link" style="list-style:none;cursor:pointer">Read the Full Description ${I.chev}</summary>
                <div style="margin-top:14px">${detailParas.map(t => `<p style="font-size:16px;color:var(--forest-70)">${glossify(esc(t), seen)}</p>`).join('')}</div>
              </details>` : ''}

            <div class="glance">
              ${tested.length ? `<div class="glance-tile"><div class="k">${I.flask}Being tested</div><div class="v${tested.slice(0, 2).join(', ').length > 16 ? ' long' : ''}" title="${esc(tested.join(', '))}">${esc(tested.slice(0, 2).join(', '))}</div>${tested.length > 2 ? `<div class="s">and ${tested.length - 2} more</div>` : ''}</div>` : ''}
              <div class="glance-tile"><div class="k">${I.person}Who can join</div><div class="v">${esc(ageRange(elig.minimumAge, elig.maximumAge))}</div><div class="s">${esc(SEX[elig.sex] ?? 'All sexes')}${elig.healthyVolunteers ? ', healthy volunteers welcome' : ''}</div></div>
              ${des.enrollmentInfo?.count ? `<div class="glance-tile"><div class="k">${I.people}How many people</div><div class="v">${fmtNum(des.enrollmentInfo.count)}</div><div class="s">${des.enrollmentInfo.type === 'ESTIMATED' ? 'Planned' : 'Enrolled'}</div></div>` : ''}
              ${durationPhrase(st.startDateStruct?.date, st.primaryCompletionDateStruct?.date) ? `<div class="glance-tile"><div class="k">${I.clock}How long</div><div class="v">${durationPhrase(st.startDateStruct.date, st.primaryCompletionDateStruct.date)}</div><div class="s">Until main results</div></div>` : ''}
              <div class="glance-tile"><div class="k">${I.pin}Where</div><div class="v">${nearest ? fmtMiles(nearest.mi) : plural(sites.length, 'site')}</div><div class="s">${nearest ? `Nearest of ${plural(sites.length, 'site')}` : openSites ? `${fmtNum(openSites)} enrolling now` : 'No sites listed'}</div></div>
            </div>
          </section>

          <!-- Eligibility -->
          <section class="sec" id="eligibility">
            <h2>Who this study is looking for</h2>
            <div class="basics">
              <div class="basic"><span class="ic">${I.person}</span><span><small>Age</small><b>${esc(ageRange(elig.minimumAge, elig.maximumAge))}</b></span></div>
              <div class="basic"><span class="ic">${I.people}</span><span><small>Sex</small><b>${esc(SEX[elig.sex] ?? 'All sexes')}</b></span></div>
              <div class="basic"><span class="ic">${I.heart}</span><span><small>Healthy volunteers</small><b>${elig.healthyVolunteers ? 'Welcome' : 'Not accepted'}</b></span></div>
            </div>
            ${crit ? `
              <div class="check-card" id="fit" aria-live="polite">
                <div class="check-card-main">
                  <h3 id="fitTitle"></h3>
                  <p id="fitBody"></p>
                  <div class="fit-bar" aria-hidden="true"><i class="f"></i><i class="b"></i><i class="u"></i></div>
                  <p class="check-meta">Your answers stay on this device.</p>
                  <p class="check-meta" id="checkReview" ${checklist.needsReview ? '' : 'hidden'}>Some saved answers could not be matched. Review the current questions.</p>
                </div>
                <div class="check-card-actions">
                  <button type="button" class="btn" id="checkGo" data-open-check="all"></button>
                  <a class="btn-link" href="doctor.html?id=${esc(idm.nctId)}" data-open-brief>${I.print}For My Doctor</a>
                </div>
              </div>
              <template id="checkAll">
                ${critGroup('i', 'What the study requires', 'Is each of these true for you?', crit.in)}
                ${critGroup('o', 'What would rule you out', 'Does any of this apply to you? There are often exceptions, so a Yes here isn’t the final word.', crit.out)}
              </template>` : `<p class="where-note">The study team makes the final call, often after a screening visit.</p>${elig.eligibilityCriteria ? `<div class="elig-col"><div class="elig-raw">${glossify(esc(unescapeMd(elig.eligibilityCriteria)), critSeen)}</div></div>` : '<p class="muted">No eligibility details were provided.</p>'}`}
          </section>

          <!-- Reach out -->
          <section class="sec" id="reach">
            <h2>Reach out to the study team</h2>
            <p class="reach-lede">Asking questions doesn’t sign you up for anything. Here’s how it usually goes from here.</p>
            <ol class="steps">
              <li class="now"><span class="n">1</span><b>You reach out</b><span>Send an email or make a call. We’ll help you write it below.</span><small>Today</small></li>
              <li><span class="n">2</span><b>A quick phone screen</b><span>A coordinator, the person who handles sign-ups, asks a few questions to check the basics.</span><small>Often 10 to 20 minutes</small></li>
              <li><span class="n">3</span><b>A screening visit</b><span>You meet the team for tests and a closer look at the requirements.</span><small>Can take a few hours</small></li>
              <li><span class="n">4</span><b>Consent, then you start</b><span>They walk you through the risks in detail. You only join if you sign, and you can leave at any time.</span><small>Only if you say yes</small></li>
            </ol>

            <div class="composer">
              <div class="composer-form">
                <div class="field">
                  <span class="field-label">Send to</span>
                  ${recips.length ? `<div class="recips" role="radiogroup" aria-label="Send to">${recips.map((r, i) => `
                    <button type="button" class="recip" role="radio" data-i="${i}" aria-checked="false">
                      <b>${esc(r.name)}</b><span>${esc(r.where)}${r.mi != null ? `<em>${esc(fmtMiles(r.mi))}</em>` : ''}</span>
                    </button>`).join('')}</div>`
                    : '<p class="composer-hint">No contact is listed for this study. Copy the message and send it to the nearest site, or ask your doctor to reach out.</p>'}
                </div>
                <label class="field"><span>Your name</span><input id="meName" autocomplete="name" placeholder="First and last name"></label>
                <div class="field-row">
                  <label class="field"><span>Age</span><input id="meAge" type="number" inputmode="numeric" min="0" max="120"></label>
                  <label class="field"><span>Where you live</span><input id="meCity" autocomplete="address-level2" placeholder="City, state"></label>
                </div>
                <label class="field"><span>Best way to reach you</span><input id="meReach" placeholder="Phone number or email"></label>
                <div class="field">
                  <span class="field-label">Also ask about</span>
                  <div class="chips" id="extras">${EXTRAS.filter(([k]) => k !== 'placebo' || hasPlacebo).map(([k, l]) => `<button type="button" class="chip" data-k="${k}" aria-pressed="false">${l}</button>`).join('')}</div>
                </div>
                <p class="composer-hint">Saved only on this device. Nothing is sent until you send it yourself.</p>
              </div>

              <div class="letter">
                <div class="letter-head" id="mode" role="group" aria-label="Message type">
                  <button type="button" class="chip" data-mode="email" aria-pressed="true">${I.mail}Email</button>
                  <button type="button" class="chip" data-mode="phone" aria-pressed="false">${I.phone}Phone Call</button>
                </div>
                <dl class="letter-meta" id="letterMeta"></dl>
                <div class="letter-body" id="letterBody"></div>
                <div class="letter-actions">
                  <a class="btn btn-sm" id="sendLetter"></a>
                  <button type="button" class="btn btn-secondary btn-sm" id="copyLetter">${I.copy}Copy</button>
                </div>
              </div>
            </div>
            <section class="follow-up" aria-labelledby="followTitle">
              <h3 id="followTitle">Follow-up</h3>
              <p class="composer-hint" id="contactStatus" role="status"></p>
              <button type="button" class="btn btn-secondary btn-sm" id="markContact">Mark as contacted</button>
              <div id="followUp" hidden>
                <label class="field"><span>Next step or note (optional)</span>
                  <textarea id="contactNote" rows="3" placeholder="What did the study team say?"></textarea>
                </label>

          <!-- What happens -->

            ${design.length ? `<ul class="design-lines">${design.map(([ic, t]) => `<li><span class="ic">${ic}</span><span>${glossify(esc(t), new Set())}</span></li>`).join('')}</ul>` : ''}

                </div>`).join('')}
              </div>
              ${arms.length > 4 ? `<button type="button" class="btn-link arms-more" aria-expanded="false">Show ${fmtNum(arms.length - 3)} More Groups ${I.chev}</button>` : ''}` : ''}
            ${outcomes.length ? `
              <div class="outcomes">
                <h3>What they’re measuring</h3>

                    ${o.description ? `<small>${esc(unescapeMd(o.description)).slice(0, 320)}${o.description.length > 320 ? '…' : ''}</small>` : ''}

          </section>

          <!-- Who -->

              ${spons.leadSponsor?.name ? `
                <div class="who-card who-sponsor">

                  ${(spons.collaborators ?? []).length ? `<small>With ${esc(listNames((spons.collaborators ?? []).map(c => c.name)))}</small>` : ''}
                  <div class="who-links"><a href="${esc(webSearch(spons.leadSponsor.name))}" target="_blank" rel="noopener">Find Their Website ${I.ext}</a></div>
                </div>` : ''}
              ${people.slice(0, 5).map(x => `
                <div class="who-card">
                  <div class="who-role">${esc(x.label)}</div>
                  <h4>${esc(x.name)}</h4>

                  <div class="who-links">

            </div>
            ${people.length > 5 ? `<p class="who-more">${plural(people.length - 5, 'more person', 'more people')} listed on <a href="https://clinicaltrials.gov/study/${esc(idm.nctId)}" target="_blank" rel="noopener">the official record</a>.</p>` : ''}
            ${!people.length ? '<p class="who-more">The record doesn’t name who leads this study. The team contact above can tell you.</p>' : ''}
            <div class="ask-box">
              <h3>Good Questions to Ask Before You Join</h3>
              <ul>
                <li>Who will be in charge of my care day to day, and how do I reach them?</li>
                <li>Which ethics board, called an IRB, approved this study? It’s the independent group that reviews studies to protect participants.</li>
                <li>Who do I call if I have a side effect or a problem?</li>
                <li>What costs, if any, will I or my insurance cover?</li>
              </ul>
            </div>
            <p class="who-fine">Names and roles come from the study record, which the study team writes and updates. The profile and publication links open a search, not a verified match, so check that the name and institution line up. Northstar can’t check credentials, so it’s fine to ask the team about their background.</p>
          </section>

          <!-- Where -->
          <section class="sec" id="where">
            <h2>${sites.length ? `${plural(sites.length, 'place')} to take part` : 'Where it happens'}</h2>
            ${sites.length ? `
              <p class="where-note">${openSites ? `${fmtNum(openSites)} ${openSites === 1 ? 'is' : 'are'} enrolling now${me ? `, sorted by distance from ${esc(me.label || 'you')}` : ''}.` : me ? `Sorted by distance from ${esc(me.label || 'you')}.` : ''}${me ? '' : ' Search with a city to sort these by distance.'}</p>
              <div class="where-grid">
                <div class="site-map"><div id="siteMap"></div></div>
                <ul class="site-list" id="siteList">
                  ${sites.slice(0, 200).map(s => {
                    const people = (s.contacts ?? []).filter(c => c.name);
                    const docs = people.filter(c => /INVESTIGATOR/.test(c.role ?? ''));
                    const c = people.find(c => (c.phone || c.email) && !docs.includes(c)) ?? (s.contacts ?? []).find(c => c.phone || c.email);
                    const place = [s.city, STATE_ABBR[s.state] ?? s.state, s.country !== 'United States' ? s.country : ''].filter(Boolean).join(', ');
                    const closed = openSites && openSites < sites.length && s.status !== 'RECRUITING';
                    return `<li data-i="${s.i}"${closed ? ' class="closed"' : ''}>
                      <div class="row"><span class="fac">${esc(s.facility ?? 'Study site')}</span><span class="dist">${s.mi != null ? fmtMiles(s.mi) : ''}</span></div>
                      <div class="place">${esc(place)}${s.zip ? ` ${esc(s.zip)}` : ''} ${s.status ? statusTag(s.status) : ''}</div>
                      ${docs.length ? `<div class="site-docs">${docs.slice(0, 3).map(d => `<span><b>${esc(d.name)}</b>${d.role === 'SUB_INVESTIGATOR' ? ', investigator' : ', lead investigator here'}</span>`).join('')}</div>` : ''}
                      ${c ? `<div class="site-contact">${c.name && !docs.includes(c) ? `<span class="who-name">${esc(c.name)}, contact</span>` : ''}${c.phone ? `<a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${esc(c.phone)}${c.phoneExt ? ` ext. ${esc(c.phoneExt)}` : ''}</a>` : ''}${c.email ? `<a href="mailto:${esc(c.email)}?subject=${encodeURIComponent(`Question about ${idm.nctId}`)}">${esc(c.email)}</a>` : ''}</div>` : ''}
                      ${s.facility ? `<div class="site-links"><a href="https://maps.apple.com/?q=${encodeURIComponent([s.facility, place].join(', '))}" target="_blank" rel="noopener">Directions ${I.ext}</a><a href="${esc(webSearch([s.facility, place].join(' ')))}" target="_blank" rel="noopener">Find Website ${I.ext}</a>${docs[0] ? `<a href="${esc(webSearch(`${plainName(docs[0].name)} ${s.facility}`))}" target="_blank" rel="noopener">Look Up ${esc(plainName(docs[0].name))} ${I.ext}</a>` : ''}</div>` : ''}
                    </li>`;
                  }).join('')}
                  ${openSites && openSites < sites.length ? `<li class="site-more"><button type="button" class="btn-link" id="showClosed">Show ${plural(sites.slice(0, 200).length - openSites, 'Site')} Not Enrolling ${I.chev}</button></li>` : ''}
                </ul>
              </div>` : '<p class="muted">No locations have been listed yet.</p>'}
          </section>

          <!-- Timeline -->
          <section class="sec" id="timeline">
            <h2>Where the study is today</h2>
            <div class="timeline" id="tl"></div>
          </section>

          <!-- Details -->
          <section class="sec" id="details">
            <h2>For your doctor</h2>
            <div class="doc-cta">
              <p>Print a short summary of this study, with your checklist answers, to bring to your next appointment.</p>
              <a class="btn btn-mint" href="doctor.html?id=${esc(idm.nctId)}" data-open-brief>${I.print}Share With My Doctor</a>
            </div>
            <div class="details-grid">
              <dl>
                ${row('Study ID', `<a class="mono record-link" href="https://clinicaltrials.gov/study/${esc(idm.nctId)}" target="_blank" rel="noopener">${esc(idm.nctId)} ${I.ext}</a>`)}
                ${row('Sponsor study ID', esc(idm.orgStudyIdInfo?.id))}
                ${row('Lead sponsor', esc(spons.leadSponsor?.name))}
                ${row('Collaborators', esc((spons.collaborators ?? []).map(c => c.name).join(', ')))}
              </dl>
              <dl>
                ${row('Study type', esc({ INTERVENTIONAL: 'Interventional (tests a treatment)', OBSERVATIONAL: 'Observational (watches and records)', EXPANDED_ACCESS: 'Expanded access' }[des.studyType] ?? des.studyType))}
                ${row('Phase', esc((des.phases ?? []).map(x => PHASE[x]?.short ?? 'Not applicable').join(', ')))}
                ${row('Allocation', esc(title(des.designInfo?.allocation)))}
                ${row('Masking', esc(title(des.designInfo?.maskingInfo?.masking)))}
              </dl>
              <dl>
                ${row('First posted', esc(fmtDate(st.studyFirstPostDateStruct?.date, true)))}
                ${row('Last updated', esc(fmtDate(st.lastUpdatePostDateStruct?.date, true)))}
                ${row('Results posted', d.hasResults ? 'Yes' : 'Not yet')}
                ${row('Conditions', esc((p.conditionsModule?.conditions ?? []).join(', ')))}
              </dl>
            </div>
          </section>
        </div>
      </div>`;

    wireChecklist(crit);
    wireBrief();
    $('#moreConds')?.addEventListener('click', e => {
      const list = $('#condList'), open = list.hidden;
      list.hidden = !open;
      e.currentTarget.setAttribute('aria-expanded', String(open));
      e.currentTarget.textContent = open ? 'show fewer' : `and ${fmtNum(conds.length - 3)} more`;
    });
    $('#showClosed')?.addEventListener('click', e => { $('#siteList').classList.add('show-closed'); e.currentTarget.closest('li').remove(); });
    $('.arms-more')?.addEventListener('click', e => {
      const btn = e.currentTarget, open = $('.arms').classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.innerHTML = open ? `Show Fewer Groups ${I.chev}` : `Show ${fmtNum(arms.length - 3)} More Groups ${I.chev}`;
    });
    wireReach({ idm, recips, crit });
    wireFollowUp(idm.nctId);
    drawTimeline(st);
    if (sites.length && typeof L !== 'undefined') drawSites(sites);
    wireToc();
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  }

  function title(s) { return s ? s.toLowerCase().replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase()) : ''; }
  function row(k, v) { return v ? `<div class="dl-row"><dt>${k}</dt><dd>${v}</dd></div>` : ''; }

  /* ---------- Can I join? checklist ---------- */
  const ANS = [['y', 'Yes'], ['n', 'No'], ['u', 'Not sure']];
  function tally(crit) {
    const t = { total: 0, answered: 0, fit: [], block: [], unsure: [] };
    if (!crit) return t;
    for (const [side, items] of [['i', crit.in], ['o', crit.out]]) items.forEach((c, n) => {
      if (c.head) return;
      t.total++;
      const s = rowState(side + n, answers[side + n]);
      if (s) { t[s].push(c.text); t.answered++; }
    });
    return t;
  }

  function verdict(t) {
    if (!t.answered) return { tone: '', title: 'Answer a few to see how you line up', body: `${plural(t.total, 'requirement')} listed. Skip anything you don’t know.` };
    if (t.block.length) return { tone: 'block', title: 'Something may rule you out', body: `${plural(t.block.length, 'item')} may not fit you. Requirements often have exceptions, so it’s still worth asking.` };
    const unsure = t.unsure.length ? ` The team can help with the ${plural(t.unsure.length, 'item')} you weren’t sure about.` : '';
    if (t.answered < t.total) return { tone: 'go', title: unsure ? 'Worth reaching out' : 'So far, so good', body: `Nothing rules you out in the ${fmtNum(t.answered)} of ${fmtNum(t.total)} you’ve answered.${unsure}` };
    if (unsure) return { tone: 'go', title: 'Worth reaching out', body: `Nothing rules you out.${unsure}` };
    return { tone: 'go', title: 'Looks like a fit', body: 'Based on your answers, you meet every listed requirement. The study team makes the final call at screening.' };
  }

  /* ---------- Can I join? drawer ----------
     The study page shows a summary card; the check opens in a drawer. "All Questions" (the default)
     lists every requirement. "By Page" shows them PAGE_SIZE at a time, requirements first, then what
     rules you out, and ends on a results page. Answers save as they're given. */
  const PAGE_SIZE = 5;
  function wireChecklist(crit) {
    if (!crit) return;

    const steps = checklistItems(crit);
    // Pages never mix the two groups.
    const pages = [];
    for (const side of ['i', 'o']) {
      const mine = steps.filter(x => x.side === side);
      for (let i = 0; i < mine.length; i += PAGE_SIZE) pages.push({ side, items: mine.slice(i, i + PAGE_SIZE) });
    }
    pages.forEach(pg => { const same = pages.filter(x => x.side === pg.side); pg.n = same.indexOf(pg) + 1; pg.of = same.length; });

    const drawer = document.createElement('div');
    drawer.className = 'drawer-root';
    drawer.innerHTML = `
      <div class="drawer-backdrop" data-close></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
        <header class="drawer-head">
          <div class="drawer-row">
            <h2 id="drawerTitle">Can I Join?</h2>
            <button type="button" class="drawer-close" data-close aria-label="Close">${I.x}</button>
          </div>
          <div class="drawer-row">
            <div class="seg" role="tablist" aria-label="View">
              <button type="button" role="tab" data-view="all" aria-selected="true">All Questions</button>
              <button type="button" role="tab" data-view="page" aria-selected="false">By Page</button>
            </div>
            <span class="drawer-count" id="dCount"></span>
          </div>
          <div class="fit-bar" aria-hidden="true"><i class="f"></i><i class="b"></i><i class="u"></i></div>
        </header>
        <div class="drawer-body">
          <div class="all-view" id="vAll">${$('#checkAll').innerHTML}</div>
          <div class="page-view" id="vPage" hidden></div>
        </div>
        <footer class="drawer-foot" id="dFoot"></footer>
      </aside>`;
    drawer.hidden = true;
    document.body.appendChild(drawer);
    const panel = $('.drawer', drawer), body = $('.drawer-body', drawer), vAll = $('#vAll', drawer), vPage = $('#vPage', drawer), foot = $('#dFoot', drawer);
    let view = 'all', page = 0, opener = null;

    const unanswered = () => steps.filter(x => !answers[x.key]).length;

    function setAnswer(key, v) {
      checklist.setAnswer(key, v);
      $('#checkReview').hidden = !checklist.needsReview;
      $$(`li[data-key="${key}"]`, drawer).forEach(li => {
        $$('button', li).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
        li.classList.remove('is-fit', 'is-block', 'is-unsure');
        if (v) li.classList.add(`is-${rowState(key, v)}`);
      });
      paint();
      redrawLetter();
    }

    function paint() {
      const t = tally(crit), v = verdict(t), left = t.total - t.answered;
      const pct = n => `${t.total ? (n / t.total) * 100 : 0}%`;
      for (const bar of [...$$('.fit-bar', $('#fit')), ...$$('.drawer-head .fit-bar', drawer)]) {
        $('.f', bar).style.width = pct(t.fit.length); $('.b', bar).style.width = pct(t.block.length); $('.u', bar).style.width = pct(t.unsure.length);
      }
      const card = $('#fit');
      card.dataset.tone = t.answered ? v.tone : '';
      card.dataset.state = !t.answered ? 'new' : left ? 'started' : 'done';
      if (!t.answered) {
        const mins = Math.max(1, Math.round(t.total * 8 / 60));
        $('#fitTitle').textContent = 'See if you might qualify';
        $('#fitBody').textContent = `${plural(t.total, 'question')} from the study’s requirements, about ${plural(mins, 'minute')}. Skip anything you don’t know.`;
      } else { $('#fitTitle').textContent = v.title; $('#fitBody').textContent = v.body; }
      $('#checkGo').innerHTML = !t.answered ? `Check If I Can Join ${I.arrow}` : left ? `Continue (${fmtNum(left)} Left) ${I.arrow}` : `Review My Answers ${I.arrow}`;
      $('#dCount').textContent = `${fmtNum(t.answered)} of ${fmtNum(t.total)} answered`;
      $$('.crit-group', vAll).forEach(g => {
        const keys = $$('li:not(.head)', g).map(li => li.dataset.key), c = $('.crit-count', g);
        c.textContent = `${fmtNum(keys.filter(k => answers[k]).length)} of ${fmtNum(+c.dataset.total)} answered`;
      });
      if (view === 'all') renderAllFoot(t, v);
    }

    const row = st => {
      const a = answers[st.key] ?? '';
      return `<li class="${[st.sub && 'sub', a && `is-${rowState(st.key, a)}`].filter(Boolean).join(' ')}" data-key="${st.key}">
        <span class="dot" aria-hidden="true"></span>
        <span class="txt">${glossify(esc(st.text), new Set())}</span>
        <div class="ans" role="group" aria-label="${st.side === 'i' ? 'Is this true for you?' : 'Does this apply to you?'}">${ANS.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${a === v}">${l}</button>`).join('')}</div>
      </li>`;
    };

    // All Questions: a pinned footer with where you stand and what to do next.
    function renderAllFoot(t = tally(crit), v = verdict(t)) {
      foot.innerHTML = `
        <div class="foot-status ${t.answered ? `tone-${v.tone}` : ''}">${t.answered ? esc(v.title) : 'Answer what you know'}</div>
        <div class="foot-actions">
          <button type="button" class="btn btn-secondary btn-sm" data-open-brief>${I.print}For My Doctor</button>
          <a class="btn btn-sm" href="#reach" data-close>Reach Out ${I.arrow}</a>
        </div>`;
    }

    function renderPage() {
      body.scrollTop = 0;
      if (page >= pages.length) return renderResults();
      const pg = pages[page];
      let lastCtx = '';
      vPage.innerHTML = `
        <p class="page-kicker ${pg.side === 'o' ? 'out' : ''}">${pg.side === 'i' ? 'What the study requires' : 'What would rule you out'}${pg.of > 1 ? `, page ${pg.n} of ${pg.of}` : ''}</p>
        <p class="page-ask">${pg.side === 'i' ? 'Is each of these true for you?' : 'Does any of this apply to you? A Yes here may rule you out, though there are often exceptions.'}</p>
        <ul class="crit">${pg.items.map(st => {
          const label = st.ctx && st.ctx !== lastCtx ? `<li class="head"><span class="dot" aria-hidden="true"></span><span class="txt">${esc(st.ctx)}</span></li>` : '';
          lastCtx = st.ctx;
          return label + row(st);
        }).join('')}</ul>`;
      const last = page === pages.length - 1;
      foot.innerHTML = `
        <button type="button" class="btn btn-secondary btn-sm" data-page="${page - 1}" ${page === 0 ? 'disabled' : ''}>${I.back}Back</button>
        <span class="foot-page">Page ${fmtNum(page + 1)} of ${fmtNum(pages.length)}</span>
        <button type="button" class="btn btn-sm" data-page="${page + 1}">${last ? 'See Results' : 'Next'} ${I.arrow}</button>`;
    }

    function renderResults() {
      const t = tally(crit), v = verdict(t), skipped = unanswered();
      const list = (title, items) => items.length ? `<h4>${title}</h4><ul>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
      vPage.innerHTML = `
        <div class="results" data-tone="${t.answered ? v.tone : ''}">
          <p class="page-kicker">${skipped ? `You skipped ${plural(skipped, 'question')}` : 'All questions answered'}</p>
          <h3>${esc(t.answered ? v.title : 'Nothing answered yet')}</h3>
          <p class="results-body">${esc(t.answered ? v.body : 'Answer what you know. Anything you skip can be a question for the study team.')}</p>
          ${skipped ? `<button type="button" class="btn-link results-skip" data-page="${pages.findIndex(pg => pg.items.some(x => !answers[x.key]))}">Go to the Skipped Questions ${I.arrow}</button>` : ''}
          ${list('May rule you out', t.block)}
          ${list('To ask the study team', t.unsure)}
        </div>`;
      foot.innerHTML = `
        <button type="button" class="btn btn-secondary btn-sm" data-page="${pages.length - 1}">${I.back}Back</button>
        <div class="foot-actions">
          <button type="button" class="btn btn-secondary btn-sm" data-open-brief>${I.print}For My Doctor</button>
          <a class="btn btn-sm" href="#reach" data-close>Reach Out ${I.arrow}</a>
        </div>`;
    }

    function setView(v) {
      view = v;
      $$('.seg [data-view]', drawer).forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
      vAll.hidden = v !== 'all'; vPage.hidden = v !== 'page';
      if (v === 'page') {
        // Start on the first page with something unanswered.
        const i = pages.findIndex(pg => pg.items.some(x => !answers[x.key]));
        page = i < 0 ? pages.length : i;
        renderPage();
      } else {
        renderAllFoot();
        // Pick up where you left off.
        const next = $$('li[data-key]', vAll).find(li => !answers[li.dataset.key]);
        body.scrollTop = 0;
        // Only jump when that row would start below the first screen.
        if (next && unanswered() < steps.length && next.offsetTop - body.offsetTop > body.clientHeight * .6) body.scrollTop = next.offsetTop - body.offsetTop - 24;
      }
    }

    function open(from) {
      opener = from ?? document.activeElement;
      drawer.hidden = false;
      document.documentElement.classList.add('drawer-open');
      requestAnimationFrame(() => drawer.classList.add('in'));
      setView(view);
      panel.focus();
    }
    function close() {
      drawer.classList.remove('in');
      document.documentElement.classList.remove('drawer-open');
      setTimeout(() => { drawer.hidden = true; }, 240);
      opener?.focus?.({ preventScroll: true });
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-open-check]');
      if (!t) return;
      e.preventDefault();
      open(t);
    });
    drawer.addEventListener('click', e => {
      if (e.target.closest('[data-open-brief]')) return; // handled by the brief modal
      if (e.target.closest('[data-close]')) { close(); return; }
      const seg = e.target.closest('.seg [data-view]'); if (seg) return setView(seg.dataset.view);
      const ab = e.target.closest('.ans button');
      if (ab) { const key = ab.closest('li').dataset.key; return setAnswer(key, answers[key] === ab.dataset.v ? '' : ab.dataset.v); }
      const pb = e.target.closest('[data-page]');
      if (pb && !pb.disabled) { page = Math.max(0, Math.min(pages.length, +pb.dataset.page)); renderPage(); }
    });
    drawer.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (!$('.brief-root:not([hidden])')) { e.preventDefault(); close(); } return; }
      if (e.key === 'Tab') trapFocus(e, panel);
    });

    paint();
  }

  // Keep keyboard focus inside an open dialog.
  function trapFocus(e, box) {
    const f = $$('button:not([disabled]), a[href], [tabindex="0"]', box).filter(x => x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
  }

  /* ---------- For My Doctor: a large modal with the printable brief ---------- */
  function wireBrief() {
    const root = document.createElement('div');
    root.className = 'brief-root';
    root.hidden = true;
    root.innerHTML = `
      <div class="brief-backdrop" data-bclose></div>
      <div class="brief-modal" role="dialog" aria-modal="true" aria-labelledby="briefTitle" tabindex="-1">
        <header class="brief-modal-head">
          <div class="brief-modal-title">
            <h2 id="briefTitle">For My Doctor</h2>
            <p>This is what your doctor will see. Print it, or save it as a PDF to email.</p>
          </div>
          <div class="brief-modal-tools">
            <div class="seg" role="tablist" aria-label="Which requirements to show">
              <button type="button" role="tab" data-bview="all" aria-selected="true">All Requirements</button>
              <button type="button" role="tab" data-bview="answered" aria-selected="false">Only My Answers</button>
            </div>
            <button type="button" class="btn btn-sm" id="briefPrint">${I.print}Print or Save PDF</button>
          </div>
          <button type="button" class="drawer-close brief-close" data-bclose aria-label="Close">${I.x}</button>
        </header>
        <div class="brief-modal-body" id="briefBody"></div>
      </div>`;
    document.body.appendChild(root);
    const box = $('.brief-modal', root), bodyEl = $('#briefBody', root);
    let opener = null, wasLocked = false;

    async function open(from) {
      if (!studyData) return;
      opener = from;
      bodyEl.innerHTML = buildBrief(studyData, { answers, needsReview: checklist.needsReview, profile, search: loadSearch(), version: await dataVersion() });
      root.hidden = false;
      wasLocked = document.documentElement.classList.contains('drawer-open');
      document.documentElement.classList.add('drawer-open');
      requestAnimationFrame(() => root.classList.add('in'));
      bodyEl.scrollTop = 0;
      box.focus();
    }
    function close() {
      root.classList.remove('in');
      if (!wasLocked) document.documentElement.classList.remove('drawer-open');
      setTimeout(() => { root.hidden = true; }, 200);
      opener?.focus?.({ preventScroll: true });
    }

    document.addEventListener('click', e => {
      const t = e.target.closest('[data-open-brief]');
      if (!t) return;
      e.preventDefault();
      open(t);
    });
    root.addEventListener('click', e => {
      if (e.target.closest('[data-bclose]')) return close();
      const v = e.target.closest('[data-bview]');
      if (v) {
        $$('[data-bview]', root).forEach(b => b.setAttribute('aria-selected', String(b === v)));
        bodyEl.classList.toggle('answered-only', v.dataset.bview === 'answered');
      }
      if (e.target.closest('#briefPrint')) {
        // Print only the sheet. A locked scroll (overflow: hidden) would cut the printout to one page.
        const html = document.documentElement, locked = html.classList.contains('drawer-open');
        html.classList.add('print-brief'); html.classList.remove('drawer-open');
        addEventListener('afterprint', () => { html.classList.remove('print-brief'); if (locked) html.classList.add('drawer-open'); }, { once: true });
        print();
      }
    });
    root.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
      else if (e.key === 'Tab') trapFocus(e, box);
    });
  }

  /* ---------- Reach out: email draft and call script ---------- */
  const EXTRAS = [
    ['visits',  'Visits and Time', 'How many visits are involved, and how long does each one take?'],
    ['cost',    'Costs',           'Will this cost me anything? Is travel or time off covered?'],
    ['doctor',  'My Own Doctor',   'Can I keep seeing my own doctor during the study?'],
    ['placebo', 'Placebo Odds',    'What are the chances I’d get the placebo instead of the treatment?'],
    ['after',   'After It Ends',   'What happens when the study ends?'],
  ];
  const ph = s => `⟦${s}⟧`; // placeholder the reader still needs to fill in
  const clip = s => s.length > 220 ? `${s.slice(0, 217).trimEnd()}…` : s;

  function letterDoc(mode, { idm, to, t }) {
    const you = profile;
    const about = [you.age ? `I’m ${you.age}` : '', you.city ? `I live in ${you.city}` : ''].filter(Boolean).join(', and ');
    const unsure = t.unsure.slice(0, 8).map(x => `“${clip(x)}”`);
    const block = t.block.slice(0, 8).map(x => `“${clip(x)}”`);
    const enrolling = `Is the study still enrolling${to?.site ? ' at your site' : ''}?`;
    const extras = EXTRAS.filter(([k]) => you.extras.includes(k) && $(`#extras [data-k="${k}"]`)).map(x => x[2]);

    if (mode === 'phone') return [
      { h: 'When they answer' },
      { p: `“Hi, my name is ${you.name || ph('your name')}. I’m calling about the study ${idm.briefTitle}, ID ${idm.nctId}. Are you the right person to talk to about joining?”` },
      ...(about ? [{ h: 'Share a little about you' }, { p: `“${about}.”` }] : []),
      { h: 'Ask' },
      { ol: [enrolling, ...unsure.map(x => `I wasn’t sure about this one: ${x}`), ...block.map(x => `Would this rule me out? ${x}`), ...extras] },
      { h: 'Have these ready' },
      { ul: ['A list of the medicines you take', 'When you were diagnosed, and your doctor’s name', 'Your calendar, in case they offer a screening visit'] },
      { h: 'Before you hang up' },
      { p: 'Write down who you spoke with and what happens next. If you get voicemail, leave your name, the study ID, and the best way to reach you.' },
    ];

    const doc = [
      { p: 'Hello,' },
      { p: `I came across your study “${idm.briefTitle}” (${idm.nctId}) and I’d like to find out whether I could take part${to?.facility ? ` at ${to.facility}` : ''}.` },
    ];
    if (about) doc.push({ p: `A little about me: ${about}.` });
    if (t.answered) {
      const reviewed = t.answered < t.total ? 'some of the study requirements' : 'the study requirements';
      doc.push({ p: `I’ve reviewed ${reviewed}. Could your team help me confirm whether I might qualify?` });
    }
    if (unsure.length) doc.push({ p: 'I wasn’t sure about these:' }, { ul: unsure });
    if (block.length) doc.push({ p: 'These might rule me out, but I’d like to check:' }, { ul: block });
    doc.push(
      { p: 'I’d also like to know:' }, { ul: [enrolling, ...extras] },
      { p: `The best way to reach me is ${you.reach || ph('your phone or email')}.` },
      { p: `Thank you,\n${you.name || ph('Your name')}` },
    );
    return doc;
  }

  const docText = doc => doc.map(b =>
    b.h ? b.h.toUpperCase()
    : b.ul ? b.ul.map(x => `- ${x}`).join('\n')
    : b.ol ? b.ol.map((x, n) => `${n + 1}. ${x}`).join('\n')
    : b.p
  ).join('\n\n').replace(/⟦(.*?)⟧/g, '[$1]');

  const docHtml = doc => doc.map(b => {
    const fill = s => esc(s).replace(/⟦(.*?)⟧/g, '<mark>$1</mark>');
    if (b.h) return `<h5>${esc(b.h)}</h5>`;
    if (b.ul) return `<ul>${b.ul.map(x => `<li>${fill(x)}</li>`).join('')}</ul>`;
    if (b.ol) return `<ol>${b.ol.map(x => `<li>${fill(x)}</li>`).join('')}</ol>`;
    return `<p>${fill(b.p)}</p>`;
  }).join('');

  let redrawLetter = () => {};
  function wireFollowUp(studyId) {
    const key = `northstar.followup.${studyId}`;
    const mark = $('#markContact'), panel = $('#followUp'), note = $('#contactNote');
    const status = $('#contactStatus');
    let entry = null;
    try {
      const stored = JSON.parse(localStorage.getItem(key));
      if (stored && Number.isFinite(stored.date) && typeof stored.note === 'string') entry = stored;
    } catch {}

    function draw() {
      mark.hidden = !!entry;
      panel.hidden = !entry;
      note.value = entry?.note ?? '';
      status.textContent = entry
        ? `Contacted on ${new Date(entry.date).toLocaleDateString(undefined, { dateStyle: 'medium' })}. Saved on this device.`
        : 'Keep track of your conversation on this device.';
    }
    function save(next) {
      try {
        if (next) localStorage.setItem(key, JSON.stringify(next));
        else localStorage.removeItem(key);
      } catch {
        status.textContent = 'Your browser could not save this change. Try again.';
        return false;
      }
      entry = next;
      draw();
      return true;
    }
    mark.addEventListener('click', () => {
      if (save({ date: Date.now(), note: '' })) note.focus();
    });
    $('#saveNote').addEventListener('click', () => {
      if (entry && save({ ...entry, note: note.value.trim() })) status.textContent += ' Note updated.';
    });
    $('#clearContact').addEventListener('click', () => {
      if (save(null)) mark.focus();
    });
    draw();
  }

  function wireReach({ idm, recips, crit }) {
    // Default to the nearest site when we know where you are; otherwise the study-wide contact.
    let pick = me && recips.some(r => r.site) ? recips.findIndex(r => r.site) : 0;
    let mode = recips[pick] && !recips[pick].email && recips[pick].phone ? 'phone' : 'email';
    const subject = `Interested in your study ${idm.nctId}`;
    const save = () => { try { localStorage.setItem(ME_KEY, JSON.stringify(profile)); } catch {} };

    for (const [sel, k] of [['#meName', 'name'], ['#meAge', 'age'], ['#meCity', 'city'], ['#meReach', 'reach']]) {
      const el = $(sel);
      el.value = profile[k] ?? '';
      el.addEventListener('input', () => { profile[k] = el.value.trim(); save(); draw(); });
    }
    $$('#extras .chip').forEach(chip => {
      chip.setAttribute('aria-pressed', String(profile.extras.includes(chip.dataset.k)));
      chip.addEventListener('click', () => {
        const on = !profile.extras.includes(chip.dataset.k);
        profile.extras = on ? [...profile.extras, chip.dataset.k] : profile.extras.filter(k => k !== chip.dataset.k);
        chip.setAttribute('aria-pressed', String(on));
        save(); draw();
      });
    });
    $$('.recip').forEach(b => b.addEventListener('click', () => { pick = +b.dataset.i; draw(); }));
    $$('#mode .chip').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; draw(); }));

    $('#copyLetter').addEventListener('click', async () => {
      const doc = letterDoc(mode, { idm, to: recips[pick], t: tally(crit) });
      try {
        await navigator.clipboard.writeText(docText(doc));
        toast(mode === 'email' ? 'Copied. Paste it into a new email.' : 'Copied. Keep it handy for your call.');
      } catch { toast('Couldn’t copy. Try selecting the text instead.'); }
    });

    function draw() {
      const to = recips[pick];
      const doc = letterDoc(mode, { idm, to, t: tally(crit) });
      $$('.recip').forEach(b => b.setAttribute('aria-checked', String(+b.dataset.i === pick)));
      $$('#mode .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));

      const phone = to?.phone ? `${to.phone}${to.ext ? ` ext. ${to.ext}` : ''}` : '';
      const row = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
      const missing = s => `<span class="muted">${s}</span>`;
      $('#letterMeta').innerHTML = mode === 'email'
        ? row('To', to?.email ? `${esc(to.name)} &lt;${esc(to.email)}&gt;` : missing(to ? 'No email listed for this contact. Try Phone Call, or pick someone else.' : 'No contact listed')) + row('Subject', esc(subject))
        : row('Call', phone ? `${esc(to.name)}, ${esc(phone)}` : missing(to ? 'No phone number listed for this contact. Try Email, or pick someone else.' : 'No contact listed'));
      $('#letterBody').innerHTML = docHtml(doc);

      const send = $('#sendLetter');
      const href = mode === 'email'
        ? to?.email && `mailto:${to.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(docText(doc))}`
        : to?.phone && `tel:${to.phone.replace(/[^\d+]/g, '')}`;
      send.hidden = !href;
      if (href) {
        send.href = href;
        send.innerHTML = mode === 'email' ? `${I.mail}Open in Email` : `${I.phone}Call ${esc(phone)}`;
      }
    }
    redrawLetter = draw;
    draw();
  }

  /* ---------- Timeline ---------- */
  function drawTimeline(st) {
    const marks = [
      { d: st.startDateStruct?.date, t: st.startDateStruct?.type, label: 'Study starts', past: 'Study started' },
      { d: st.primaryCompletionDateStruct?.date, t: st.primaryCompletionDateStruct?.type, label: 'Main results expected', past: 'Main data collected' },
      { d: st.completionDateStruct?.date, t: st.completionDateStruct?.type, label: 'Study ends', past: 'Study ended' },
    ].filter(m => m.d && parseDate(m.d));
    const el = $('#tl');
    if (!marks.length) { el.outerHTML = '<p class="muted">No dates have been listed yet.</p>'; return; }
    const now = new Date();
    // Collapse duplicate dates (primary completion often equals completion)
    const uniq = marks.filter((m, i) => marks.findIndex(x => x.d === m.d) === i);
    const all = [...uniq.map(m => ({ ...m, date: parseDate(m.d) })), { today: true, date: now }].sort((a, b) => a.date - b.date);
    const lo = all[0].date, hi = all.at(-1).date, span = Math.max(1, hi - lo);
    const pos = dt => 3 + ((dt - lo) / span) * 94;
    const todayPct = pos(now);
    el.innerHTML = `
      <div class="tl-bar"><div class="tl-fill" style="width:${Math.min(100, Math.max(0, todayPct))}%"></div>
        ${all.map((m, i) => {
          const edge = i === 0 ? 'first' : i === all.length - 1 ? 'last' : '';
          const side = i % 2 === 0 ? 'below' : 'above';
          if (m.today) return `<div class="tl-mark tl-today ${side} ${edge}" style="left:${pos(m.date)}%"><div class="dot"></div><div class="lbl"><b>Today</b>${now.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</div></div>`;
          const past = m.date <= now;
          return `<div class="tl-mark ${side} ${edge}" style="left:${pos(m.date)}%"><div class="dot"></div><div class="lbl"><b>${esc(fmtDate(m.d))}</b>${esc(past ? m.past : m.label)}${m.t === 'ESTIMATED' && !past ? ' (estimated)' : ''}</div></div>`;
        }).join('')}
      </div>`;
  }

  /* ---------- Site map ---------- */
  function drawSites(sites) {
    const map = makeMap($('#siteMap'));
    map.invalidateSize();
    const pts = [], markers = new Map();
    if (me) { youMarker(me.lat, me.lon).bindTooltip('You', { direction: 'top', offset: [0, -8] }).addTo(map); pts.push([me.lat, me.lon]); }
    for (const s of sites) {
      if (!s.geoPoint) continue;
      const m = dotMarker(s.geoPoint.lat, s.geoPoint.lon, `site ${s.status === 'RECRUITING' ? '' : 'off'}`).addTo(map);
      m.bindPopup(`<b>${esc(s.facility ?? 'Study site')}</b>${esc([s.city, s.state].filter(Boolean).join(', '))}${s.mi != null ? `<br>${fmtMiles(s.mi)} away` : ''}`);
      m.on('click', () => {
        const li = $(`#siteList li[data-i="${s.i}"]`);
        $$('#siteList li.hot').forEach(x => x.classList.remove('hot'));
        li?.classList.add('hot'); li?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
      markers.set(s.i, m);
      pts.push([s.geoPoint.lat, s.geoPoint.lon]);
    }
    // Frame "you + the closest few" so the map is useful, not a world view of every site.
    const focus = me ? [[me.lat, me.lon], ...sites.filter(s => s.geoPoint).slice(0, 3).map(s => [s.geoPoint.lat, s.geoPoint.lon])] : pts;
    if (focus.length > 1) map.fitBounds(focus, { animate: false, padding: [40, 40], maxZoom: 10 });
    else if (focus.length === 1) map.setView(focus[0], 9, { animate: false });
    $('#siteList').addEventListener('click', e => {
      const li = e.target.closest('li[data-i]');
      if (!li || e.target.closest('a')) return;
      const m = markers.get(+li.dataset.i);
      if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 10)); m.openPopup(); }
      $$('#siteList li.hot').forEach(x => x.classList.remove('hot'));
      li.classList.add('hot');
    });
    setTimeout(() => map.invalidateSize(), 60);
  }

  /* ---------- TOC scrollspy ---------- */
  function wireToc() {
    const links = $$('.toc a');
    links[0]?.classList.add('on');
    const io = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) links.forEach(a => {
        const on = a.getAttribute('href') === `#${e.target.id}`;
        a.classList.toggle('on', on);
        // On phones the TOC is a horizontal bar; keep the current section's link in view.
        if (on) { const bar = a.closest('.toc'); if (bar.scrollWidth > bar.clientWidth) bar.scrollTo({ left: a.offsetLeft - 16, behavior: 'smooth' }); }
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    $$('.sec').forEach(s => io.observe(s));
  }

  async function start() {
    try {
      const search = loadSearch();
      me = search.lat !== '' && search.lat != null ? { lat: +search.lat, lon: +search.lon, label: search.loc } : null;
      try { profile = JSON.parse(localStorage.getItem(ME_KEY)) ?? {}; } catch { profile = {}; }
      if (typeof profile !== 'object' || Array.isArray(profile)) profile = {};
      profile.city ??= search.loc ?? '';
      profile.extras ??= ['visits', 'cost'];
      mountChrome('find');
      $('[data-mark]').innerHTML = I.mark;
      await load();
    } catch (err) {
      console.error('Study page failed to load', err);
      // Still offer a way out if the shared script itself failed to load.
      document.getElementById('page').innerHTML = '<div class="wrap" style="padding:80px 0"><div class="state"><h2>We couldn’t display this study</h2><p>Try refreshing this page. If it still doesn’t load, you can find the study on ClinicalTrials.gov.</p><a class="btn" href="https://clinicaltrials.gov/">Open ClinicalTrials.gov</a></div></div>';
    }
  }
  return start();
})();
</script>
