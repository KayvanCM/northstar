<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar · Study Brief</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%23173F43%22/%3E%3Cg%20transform%3D%22translate%284%204%29%22%20color%3D%22%23AFD5CF%22%3E%3Cpath%20d%3D%22M12%202.5%2015.4%2012H8.6zM13.7%2012a1.7%201.7%200%200%200-3.4%200z%22%20fill%3D%22currentColor%22%20fill-rule%3D%22evenodd%22/%3E%3Cpath%20d%3D%22M8.6%2012h6.8L12%2021.5zM10.3%2012a1.7%201.7%200%200%200%203.4%200z%22%20fill%3D%22currentColor%22%20fill-rule%3D%22evenodd%22%20opacity%3D%22.45%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="brief-page">

<div class="brief-bar">
  <div class="brief-bar-in">
    <a class="crumb-link" id="backLink" href="study.html">Back to Study</a>
    <div class="brief-bar-mid" id="viewToggle" role="group" aria-label="Which requirements to show">
      <button type="button" class="chip" data-view="all" aria-pressed="true">All Requirements</button>
      <button type="button" class="chip" data-view="answered" aria-pressed="false">Only My Answers</button>
    </div>
    <button type="button" class="btn btn-sm" id="printBtn">Print or Save PDF</button>
  </div>
  <p class="brief-bar-note">This is what your doctor will see. Studies with long lists of requirements continue onto a second page. Choose Only My Answers to keep it shorter.</p>
</div>

<main id="page">
  <div class="loading-page"><div class="brand-mark" data-mark></div>Preparing the summary…</div>
</main>

<script src="assets/app.js"></script>
<script>
  $('[data-mark]').innerHTML = I.mark;
  $('#backLink').insertAdjacentHTML('afterbegin', I.back);
  $('#printBtn').insertAdjacentHTML('afterbegin', I.print);

  const id = (new URLSearchParams(location.search).get('id') ?? '').toUpperCase().trim();
  $('#backLink').href = `study.html?id=${encodeURIComponent(id)}`;
  const answers = (() => { try { return JSON.parse(localStorage.getItem(`northstar:check:${id}`)) ?? {}; } catch { return {}; } })();
  const profile = (() => { try { return JSON.parse(localStorage.getItem('northstar:me')) ?? {}; } catch { return {}; } })();

  async function load() {
    if (!/^NCT\d{8}$/.test(id)) return fail('That doesn’t look like a study ID', 'Study IDs look like NCT01234567.');
    let d;
    try { d = await api(`/studies/${id}`); }
    catch (err) { return fail('We couldn’t load this study', `${err.message}. Try again in a moment.`); }
    render(d, await dataVersion());
  }

  function fail(title, body) {
    $('#page').innerHTML = `<div class="wrap" style="padding:80px 0"><div class="state"><h2>${esc(title)}</h2><p>${esc(body)}</p><a class="btn" href="${esc(searchToUrl(loadSearch()))}">Back to Studies</a></div></div>`;
  }

  function render(d, version) {
    document.title = `Northstar Study Brief, ${d.protocolSection.identificationModule.nctId}${profile.name ? `, ${profile.name}` : ''}`;
    $('#page').innerHTML = buildBrief(d, { answers, profile, search: loadSearch(), version });
  }

  $$('#viewToggle .chip').forEach(b => b.addEventListener('click', () => {
    $$('#viewToggle .chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    document.body.classList.toggle('answered-only', b.dataset.view === 'answered');
  }));
  $('#printBtn').addEventListener('click', () => print());

  load();
</script>
</body>
</html>
